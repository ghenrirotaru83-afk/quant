<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fe9ff"/>
      <stop offset="0.5" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#1a5fd0"/>
    </linearGradient>
    <radialGradient id="qcore" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#bff0ff"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </radialGradient>
  </defs>
  <!-- outer hex frame -->
  <path d="M32 4 56 18 56 46 32 60 8 46 8 18Z" stroke="url(#qg)" stroke-width="2.5" fill="rgba(47,129,247,0.06)"/>
  <!-- orbit rings -->
  <ellipse cx="32" cy="32" rx="18" ry="8" stroke="url(#qg)" stroke-width="1.6" transform="rotate(35 32 32)" opacity="0.7"/>
  <ellipse cx="32" cy="32" rx="18" ry="8" stroke="url(#qg)" stroke-width="1.6" transform="rotate(-35 32 32)" opacity="0.7"/>
  <!-- core -->
  <circle cx="32" cy="32" r="6" fill="url(#qcore)"/>
  <!-- Q tail -->
  <line x1="34" y1="34" x2="44" y2="44" stroke="#7fe9ff" stroke-width="3" stroke-linecap="round"/>
</svg>
